[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Suppress DeprecationWarning from pytest-asyncio internals on Python 3.14
# (asyncio.get_event_loop_policy deprecation). These originate in pytest-asyncio
# 0.25.x, not in our test code. Remove this filter when pytest-asyncio is updated.
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio

